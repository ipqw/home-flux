# k3s ставит traefik своим helm-контроллером. Переопределить values можно
# только так — HelmChartConfig с тем же именем в kube-system; править сам
# HelmChart бесполезно, k3s перезапишет его при рестарте.
#
# Что здесь делается и зачем:
#   443 на хосте отдан Xray под Reality. Traefik держит 80 (там ACME-проверки)
#   и переезжает на 8443 — но ВНУТРЬ кластера, без публикации наружу.
#
# expose.default: false — ключевая строка. Без неё servicelb вешает 8443
# на внешний интерфейс, и любой сканер портов достучится до traefik напрямую,
# минуя Reality: маскировка обходится одной строкой в nmap. Проверено —
# порт действительно отвечал снаружи, пока эта строка не появилась.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      websecure:
        exposedPort: 8443
        expose:
          default: false
---
# Отдельный внутрикластерный адрес для traefik: сюда Xray отправляет всё,
# что не прошло аутентификацию Reality. ClusterIP наружу не маршрутизируется.
apiVersion: v1
kind: Service
metadata:
  name: traefik-internal
  namespace: kube-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: traefik-kube-system
    app.kubernetes.io/name: traefik
  ports:
    - name: websecure
      port: 8443
      targetPort: websecure
