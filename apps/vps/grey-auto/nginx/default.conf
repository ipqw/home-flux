# Слушаем 8080, а не 80: контейнер работает от nginx-пользователя (101),
# а порты ниже 1024 ему недоступны без лишних capability.
server {
  listen 8080;
  server_name _;
  root /srv/site;
  index index.html;
  charset utf-8;
  charset_types text/html text/plain text/xml application/xml;

  # Шрифты вшиты в саму страницу base64, внешних запросов нет —
  # поэтому кешировать нечего, кроме самого HTML. Держим короткий кеш:
  # правка текста должна доезжать до посетителя в тот же день.
  location = / {
    add_header Cache-Control "public, max-age=600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files /index.html =404;
  }

  location = /robots.txt  { add_header Cache-Control "public, max-age=3600" always; }
  location = /sitemap.xml { add_header Cache-Control "public, max-age=3600" always; }
  # превью для мессенджеров: меняется редко, кешируется на сутки
  location = /og.png     { add_header Cache-Control "public, max-age=86400" always; }

  # Одностраничник: всё остальное — 404, но не голый nginx-баннер,
  # а короткая страница со ссылкой на корень.
  location / {
    try_files $uri =404;
  }

  error_page 404 = @notfound;
  location @notfound {
    default_type text/html;
    return 404 '<!doctype html><html lang="ru"><meta charset="utf-8"><title>Страница не найдена — Грэй-Авто</title><body style="font-family:system-ui;background:#e9e6e0;color:#0f1216;padding:2rem"><h1>Страница не найдена</h1><p><a href="/">Вернуться на главную</a> · <a href="tel:+79608507507">+7 960 850-75-07</a></p></body></html>';
  }

  gzip on;
  gzip_types text/plain text/css application/xml application/json;
  gzip_min_length 512;
}
