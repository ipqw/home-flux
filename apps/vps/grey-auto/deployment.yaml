# Статический сайт автосервиса «Грей Авто». Образ не собираем: и страница,
# и конфиг nginx приезжают ConfigMap'ами, поэтому правка текста — это один
# коммит в этот каталог, без реестра и без CI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grey-auto
  namespace: grey-auto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grey-auto
  template:
    metadata:
      labels:
        app: grey-auto
    spec:
      # Имена ConfigMap'ов получают хеш содержимого (kustomize), поэтому
      # правка HTML меняет имя тома и под пересоздаётся сам. Ручного
      # «не забудь сменить версию в аннотации» здесь не нужно.
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: site
              mountPath: /srv/site
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          resources:
            requests:
              cpu: 5m
              memory: 12Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: site
          configMap:
            name: grey-auto-site
        - name: conf
          configMap:
            name: grey-auto-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
