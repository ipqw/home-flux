# Ключи LiveKit. Это пара «имя ключа — секрет», которой lk-jwt-service
# подписывает пропуска для участников звонка. Кто знает секрет, тот выпишет
# себе пропуск в любую комнату, поэтому файл целиком в SOPS.
#
# Конфиг LiveKit лежит здесь же, а не в ConfigMap, ровно по этой причине:
# ключи внутри него.
#
# Правка секрета не перезапускает под — после изменения бампни configVersion
# в livekit.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: livekit-config
  namespace: rtc
type: Opaque
stringData:
  livekit.yaml: |
    # Сигнальный порт: сюда клиент приходит по WebSocket, чтобы договориться
    # о звонке. Наружу торчит через traefik как wss://livekit.ipqw.cc
    port: 7880
    bind_addresses:
      - ""

    rtc:
      # Весь медиатрафик идёт одним UDP-портом 443.
      #
      # Это не совпадение с HTTPS: TCP 443 занят xray, а UDP 443 свободен,
      # и именно на нём живёт QUIC — то есть обычный трафик современных
      # сайтов. Голос и видео родни выглядят как посещение чего-то большого
      # и популярного, а не как звонок на нестандартном порту, который
      # оператору легко срезать.
      #
      # Обычная схема LiveKit — диапазон 50100-50200 — потребовала бы
      # открыть сотню портов и была бы видна как звонок.
      udp_port: 443
      # Определить свой внешний адрес сам, через STUN. Без этого LiveKit
      # анонсировал бы клиентам внутренний адрес, и медиа никуда не пошло.
      use_external_ip: true
      enable_loopback_candidate: false

    keys:
      BwilUlDPoa8YeLVkP0hW: OoNXap7spHVg18wceTMhzcFvyihnj7As4oXwzkp6yHpFO53cjjtpa9qvX2tzfweV

    room:
      # Комнату создаёт только lk-jwt-service, проверив, что человек
      # действительно есть на нашем Matrix-сервере. Без этого любой,
      # кто дотянулся до порта, завёл бы себе конференцию.
      auto_create: false

    logging:
      level: info
---
apiVersion: v1
kind: Secret
metadata:
  name: livekit-keys
  namespace: rtc
type: Opaque
stringData:
  key: BwilUlDPoa8YeLVkP0hW
  secret: OoNXap7spHVg18wceTMhzcFvyihnj7As4oXwzkp6yHpFO53cjjtpa9qvX2tzfweV
