# Выход в интернет с немецкого адреса VPS — для трубы обхода белого списка.
#
# Зачем: дом-релей (creator whitelist-bypass) вынимает трафик телефона из
# WB-звонка и отдаёт его сюда флагом -upstream-socks 10.8.0.1:1080 по туннелю
# дом↔VPS. Отсюда трафик выходит в интернет немецким IP VPS — телефон получает
# полноценный немецкий VPN, несмотря на белый список оператора.
#
# Зеркало exit-ru (тот выпускает VPS российским IP через дом). Здесь голый
# SOCKS5 без аутентификации, и это осознанно: слушает он только на 10.8.0.1 —
# адресе VPS в туннеле, — а туда попадает исключительно дом. Из локальной сети
# VPS и из интернета порт недоступен.
#
# Жёсткий freedom: этот под НЕ уходит в общий xray-роутер VPS (там geoip:ru →
# exit-ru). Иначе трафик телефона к РФ-сайту улетел бы VPS→дом→VPS по кругу.
# Для трубы выход всегда немецкий, петли нет.
apiVersion: v1
kind: ConfigMap
metadata:
  name: exit-de-config
  namespace: exit-de
data:
  config.json: |
    {
      "log": { "loglevel": "warning" },
      "inbounds": [
        {
          "tag": "socks-in",
          "listen": "0.0.0.0",
          "port": 1080,
          "protocol": "socks",
          "settings": { "auth": "noauth", "udp": true }
        }
      ],
      "outbounds": [
        { "tag": "direct", "protocol": "freedom" }
      ]
    }
