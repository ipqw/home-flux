apiVersion: v1
kind: ConfigMap
metadata:
  name: subs-nginx
  namespace: subs
data:
  default.conf: "server {\n  listen 8080;\n  server_name _;\n\n  error_page 404 =\
    \ @notfound;\n  location @notfound {\n    default_type text/html;\n    return\
    \ 404 '<html><head><title>404 Not Found</title></head><body><center><h1>404 Not\
    \ Found</h1></center><hr><center>nginx</center></body></html>';\n  }\n\n  location\
    \ /sub/ {\n    alias /srv/sub/;\n    default_type text/plain;\n    add_header\
    \ profile-title \"base64:aXBxdw==\" always;\n    add_header profile-update-interval\
    \ \"12\" always;\n    add_header subscription-userinfo \"upload=0; download=0;\
    \ total=0; expire=0\" always;\n    add_header routing \"happ:\"\
    \ always;\n    add_header cache-control \"no-store\" always;\n  }\n\n  location\
    \ = / { return 404; }\n}\n"
