# Раздатчик подписок. Отдаёт статические файлы по секретным путям
# и добавляет заголовки, из которых клиент берёт имя профиля, интервал
# обновления и правила маршрутизации.
#
# Подписка обязана быть доступна БЕЗ туннеля: клиент тянет её до того,
# как подключился. Поэтому путь /sub/ висит на публичном домене и
# приезжает через тот же Reality-fallback, что и музыка.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subs
  namespace: subs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subs
  template:
    metadata:
      labels:
        app: subs
      annotations:
        contentVersion: "58cc460f"
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: content
              mountPath: /srv/sub
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: content
          secret:
            secretName: subs-content
        - name: conf
          configMap:
            name: subs-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
