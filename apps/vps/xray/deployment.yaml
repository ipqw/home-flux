apiVersion: apps/v1
kind: Deployment
metadata:
  name: xray
  namespace: xray
spec:
  replicas: 1
  # Recreate, а не RollingUpdate: под с hostNetwork занимает порт 443
  # на самой ноде, и второй такой же не запланируется, пока первый жив.
  # При RollingUpdate новый под встаёт в Pending и ждёт вечно.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xray
  template:
    metadata:
      labels:
        app: xray
      annotations:
        # Kubernetes НЕ перезапускает под при изменении Secret — смонтированный
        # файл обновится, но Xray перечитает его только при старте. Поэтому
        # правка конфига обязана сопровождаться сменой этой строки, иначе
        # коммит уедет, Flux отрапортует успех, а работать будет старый конфиг.
        configVersion: "55017b60"
    spec:
      # Xray обязан слушать 443 на самой ноде: Reality работает только там,
      # где он видит TLS-приветствие клиента первым. Через Service этого
      # не сделать — traefik бы уже снял TLS до него.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: xray
          # Версия пинуется. latest означал бы, что кластер меняется
          # без коммита — ровно то, что GitOps должен исключать.
          image: ghcr.io/xtls/xray-core:26.7.28
          args: ["run", "-c", "/etc/xray/config.json"]
          ports:
            - name: reality
              containerPort: 443
          volumeMounts:
            - name: config
              mountPath: /etc/xray
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            # Здесь пришлось пойти на root, и это не небрежность.
            # NET_BIND_SERVICE для non-root процесса попадает только
            # в permitted-набор, но не в effective: чтобы поднять её оттуда,
            # нужны ambient capabilities, которых Kubernetes не выдаёт.
            # Поэтому либо root с одной-единственной capability, либо
            # ip_unprivileged_port_start на всей ноде — второе меняет правила
            # для всех процессов машины ради одного пода.
            runAsUser: 0
            capabilities:
              # Сброшено всё, кроме права занять порт ниже 1024.
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
      volumes:
        - name: config
          secret:
            secretName: xray-config
