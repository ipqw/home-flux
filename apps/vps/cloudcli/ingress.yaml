# cc.ipqw.cc — claude code, читается одинаково с обеих сторон.
#
# Дверь наружу держит собственный логин cloudcli (single-user, JWT). Basic-auth
# поверх него был снят: свой пароль в интерфейсе уже есть, второй замок только
# мешал форме регистрации.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudcli
  namespace: cloudcli
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cc.ipqw.cc
      secretName: cloudcli-tls
  rules:
    - host: cc.ipqw.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudcli
                port:
                  number: 80
