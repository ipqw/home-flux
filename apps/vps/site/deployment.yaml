# Сайт-донор для Reality. Он должен быть настоящим: проверяющий, постучавшись
# без ключа, получит именно эту страницу с валидным сертификатом. Заглушка
# на 404 маскировку бы сломала — в этом вся разница со схемой «fallback в никуда».
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  namespace: site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: site
  template:
    metadata:
      labels:
        app: site
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: content
          configMap:
            name: site-content
        - name: conf
          configMap:
            name: site-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: site-nginx
  namespace: site
data:
  default.conf: |
    server {
      # 8080, а не 80: контейнер работает не от root, а привилегированные
      # порты ниже 1024 без root недоступны.
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      location / { try_files $uri $uri/ =404; }
    }
