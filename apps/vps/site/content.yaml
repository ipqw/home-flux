apiVersion: v1
kind: ConfigMap
metadata:
  name: site-content
  namespace: site
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>ipqw</title>
      <style>
        :root { color-scheme: light dark; }
        body {
          margin: 0; min-height: 100vh;
          display: flex; align-items: center; justify-content: center;
          font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
          background: #fbfbfa; color: #1a1a1a;
        }
        main { max-width: 34rem; padding: 2rem; }
        h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 .4rem; letter-spacing: -.01em; }
        p  { margin: 0 0 1.1rem; color: #4a4a4a; }
        a  { color: #1a1a1a; text-decoration: none; border-bottom: 1px solid #cfcfcf; }
        a:hover { border-color: #1a1a1a; }
        ul { list-style: none; padding: 0; margin: 0; display: flex; gap: 1.2rem; }
        @media (prefers-color-scheme: dark) {
          body { background: #121212; color: #ededed; }
          p { color: #a5a5a5; }
          a { color: #ededed; border-color: #3d3d3d; }
          a:hover { border-color: #ededed; }
        }
      </style>
    </head>
    <body>
      <main>
        <h1>ipqw</h1>
        <p>Software engineer. Backend, infrastructure, applied AI.</p>
        <ul>
          <li><a href="https://github.com/ipqw">GitHub</a></li>
        </ul>
      </main>
    </body>
    </html>
