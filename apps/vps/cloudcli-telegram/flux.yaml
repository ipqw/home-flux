# Бот живёт в своём приватном репо ipqw/cloudcli-telegram вместе с манифестами
# (Deployment + ConfigMap с кодом). Здесь только откуда и как его забирать.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cloudcli-telegram
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/ipqw/cloudcli-telegram
  ref:
    branch: main
  # deploy key только на чтение, см. git-secret.yaml
  secretRef:
    name: cloudcli-telegram-git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudcli-telegram
  namespace: flux-system
spec:
  interval: 10m
  path: ./
  prune: true
  sourceRef:
    kind: GitRepository
    name: cloudcli-telegram
