apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudcli
resources:
  - deployment.yaml
  # TELEGRAM_BOT_TOKEN, ALLOWED_USERS, CLOUDCLI_USERNAME, CLOUDCLI_PASSWORD (SOPS)
  - secret.yaml
# Код бота лежит обычным файлом; хеш в имени ConfigMap перезапускает под при правке.
configMapGenerator:
  - name: cloudcli-telegram
    files:
      - bot.mjs
