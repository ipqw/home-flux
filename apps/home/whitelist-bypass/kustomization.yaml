apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - service.yaml
  - statefulset.yaml
  - bot.yaml
  - secret-vk.yaml      # whitelist-bypass-vk: VK_TOKEN, VK_GROUP_ID
  - secret-ghcr.yaml    # ghcr-pull: read:packages для приватных образов
configMapGenerator:
  - name: whitelist-bypass-users
    namespace: whitelist-bypass
    files:
      - users.json
