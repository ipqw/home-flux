# Без tls-блока намеренно: сертификат для vw.ipqw.cc выпускает и терминирует
# traefik на VPS, сюда трафик приходит уже расшифрованным по WireGuard.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  ingressClassName: traefik
  rules:
    - host: vw.ipqw.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  number: 80
